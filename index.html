<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gratidão Sonora</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:15px}
h1{color:#FFD700}
.botoes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.btn{border:none;padding:12px 16px;border-radius:25px;font-weight:bold;cursor:pointer;font-size:13px}
.btn-voltar{background:#333;color:#fff;border:1px solid #777}
.card{background:#1a1a1a;border-radius:15px;padding:15px;margin:15px 0;border:1px solid #333}
.card.tocando{border-color:#FFD700;box-shadow:0 0 15px rgba(255,215,0,0.4)}
audio{width:100%;margin-top:10px}
#fileInput{display:none}
#boxGratidao{display:none;background:#111;border:1px solid #FFD700;border-radius:15px;padding:15px;margin:20px 0}
textarea{width:95%;height:70px;border-radius:10px;padding:10px}
.topo-voltar{display:none;justify-content:space-between;align-items:center;margin-bottom:10px}
</style>
</head>
<body>
<h1>🙏 Gratidão Sonora</h1>

<div class="botoes">
<button class="btn" style="background:#fff;color:#000" onclick="abrirBanco()">🏦 Banco</button>
<button class="btn" style="background:#1a1a1a;color:#FFD700;border:1px solid #FFD700" onclick="mostrarGratidao()">✨ Gratidão</button>
<button class="btn" style="background:#222;color:#fff;border:1px solid #555" onclick="tocarAleatorio()">▶️ Tocar</button>
<button class="btn" style="background:linear-gradient(90deg,#FFD700,#FFA500);color:#000" onclick="document.getElementById('fileInput').click()">+ 🎵 Add Música</button>
</div>

<input type="file" id="fileInput" accept="audio/*" multiple>

<div id="boxGratidao">
<div class="topo-voltar" id="voltarGratidao" style="display:flex">
<span style="color:#FFD700">Gratidão</span>
<button class="btn btn-voltar" onclick="voltar()">⬅️ Voltar</button>
</div>
<h3 style="color:#FFD700">O que você agradece hoje?</h3>
<textarea id="textoGratidao" placeholder="Escreva 3 motivos..."></textarea><br><br>
<button class="btn" style="background:#FFD700;color:#000" onclick="salvarGratidao()">Salvar</button>
<p id="listaGratidao"></p>
</div>

<div id="boxTocando" style="display:none">
<div class="topo-voltar" style="display:flex">
<span style="color:#FFD700">🔀 Tocando Aleatório</span>
<button class="btn btn-voltar" onclick="voltar()">⬅️ Voltar</button>
</div>
<p id="agoraTocando" style="color:#FFD700;font-weight:bold"></p>
<button class="btn" style="background:#222;color:#fff;border:1px solid #555;margin-top:10px" onclick="tocarAleatorio()">⏭️ Próxima Aleatória</button>
</div>

<div id="listaMusica">
<div class="card"><b>Musica 1</b><audio controls src="musica1.mp3"></audio></div>
<div class="card"><b>Musica 2</b><audio controls src="musica2.mp3"></audio></div>
<div class="card"><b>Musica 3</b><audio controls src="musica3.mp3"></audio></div>
<div class="card"><b>Musica 4</b><audio controls src="musica4.mp3"></audio></div>
<div class="card"><b>Musica 5</b><audio controls src="musica5.mp3"></audio></div>
<div class="card"><b>Musica 6</b><audio controls src="musica6.mp3"></audio></div>
</div>

<script>
let historico = ['lista']; // guarda onde estava
let audioAtual = null;

function salvarEstado(atual){
  historico.push(atual);
}

function voltar(){
  if(historico.length <= 1) {
    document.getElementById('boxGratidao').style.display='none';
    document.getElementById('boxTocando').style.display='none';
    document.getElementById('listaMusica').style.display='block';
    if(audioAtual){ audioAtual.pause(); }
    return;
  }
  historico.pop();
  let anterior = historico[historico.length-1];
  document.getElementById('boxGratidao').style.display='none';
  document.getElementById('boxTocando').style.display='none';
  document.getElementById('listaMusica').style.display='block';
  if(anterior === 'gratidao') mostrarGratidaoSemSalvar();
  if(audioAtual && anterior!== 'tocando') audioAtual.pause();
}

function abrirBanco(){
  salvarEstado('lista');
  window.open('https://bancogratidaooficial-ops.github.io/BANCO-GRATIDAO/','_blank');
}

function mostrarGratidao(){
  salvarEstado('gratidao');
  document.getElementById('boxGratidao').style.display='block';
  document.getElementById('listaMusica').style.display='none';
  document.getElementById('boxTocando').style.display='none';
}
function mostrarGratidaoSemSalvar(){
  document.getElementById('boxGratidao').style.display='block';
  document.getElementById('listaMusica').style.display='none';
  document.getElementById('boxTocando').style.display='none';
}

function tocarAleatorio(){
  salvarEstado('tocando');
  document.getElementById('boxGratidao').style.display='none';
  document.getElementById('boxTocando').style.display='block';
  document.getElementById('listaMusica').style.display='block';

  const audios = document.querySelectorAll('#listaMusica audio');
  if(audios.length === 0) return;

  // tira destaque antigo
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('tocando'));

  // escolhe aleatório
  let indice = Math.floor(Math.random() * audios.length);
  let escolhido = audios[indice];
  let nome = escolhido.parentElement.querySelector('b').innerText;

  // para o anterior
  if(audioAtual) audioAtual.pause();
  audioAtual = escolhido;

  escolhido.parentElement.classList.add('tocando');
  document.getElementById('agoraTocando').innerText = '🎵 Tocando agora: ' + nome;
  escolhido.play();

  // quando acabar, toca outra aleatória automaticamente
  escolhido.onended = () => tocarAleatorio();
  escolhido.scrollIntoView({behavior:'smooth', block:'center'});
}

function salvarGratidao(){
  let t=document.getElementById('textoGratidao').value;
  if(!t)return;
  let l=JSON.parse(localStorage.getItem('gratidoes')||'[]');
  l.push(t);
  localStorage.setItem('gratidoes',JSON.stringify(l));
  document.getElementById('textoGratidao').value='';
  document.getElementById('listaGratidao').innerHTML=l.map(g=>`• ${g}`).join('<br>');
}

const input=document.getElementById('fileInput');
input.addEventListener('change', function(){
  for(let file of this.files){
    const url=URL.createObjectURL(file);
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`<b>🎵 ${file.name}</b><audio controls src="${url}"></audio>`;
    document.getElementById('listaMusica').appendChild(div);
  }
});
</script>
</body>
</html>
