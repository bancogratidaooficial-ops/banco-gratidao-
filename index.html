<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banco Gratidão 10.2 LIMPO</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:#1a0a2e;color:#fff;padding-bottom:90px}.top{position:sticky;top:0;z-index:99;background:#1a0a2e;padding:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.tab{padding:10px 14px;border-radius:20px;border:2px solid #fff;font-weight:900;background:#333;color:#fff}.tab.ativo{background:gold;color:#000}.banner{margin:10px;background:gold;color:#000;padding:12px;border-radius:12px;text-align:center;font-weight:900}.card{margin:10px;border:2px solid gold;border-radius:14px;padding:12px;background:#2a1a4a}.btn{padding:12px 16px;border-radius:20px;border:none;font-weight:900}.btn-y{background:gold;color:#000;width:100%;padding:16px;margin-top:8px}.btn-d{background:#222;color:#fff;border:1px solid #444}.musica{border:2px solid gold;border-radius:14px;padding:12px;margin:10px;background:#1a1a00}#back{position:fixed;bottom:12px;left:12px;background:#222;border:1px solid gold;color:gold;padding:10px 18px;border-radius:20px;font-weight:900;z-index:99}</style></head><body>
<div class="top"><button class="tab ativo" onclick="aba('g',this)">✨ Gratidão</button><button class="tab" onclick="aba('s',this)">🎵 Sonora</button><button class="tab" onclick="aba('b',this)">🏦 Banco</button></div>
<div class="banner">10.2 LIMPO - BOTÃO TOCA DE VERDADE<br>Se aparecer música com código, clique LIMPAR</div>
<div id="ag"><div class="card"><button class="btn btn-y" onclick="addMusica()">+ 🎵 Add Música DO CELULAR - ABRE DIRETO</button><button class="btn" style="width:100%;margin-top:6px;background:#ff4444;color:#fff;padding:12px;border-radius:20px" onclick="limparTudo()">🗑️ LIMPAR MÚSICAS COM ERRO (código amarelo)</button></div><div id="lg"></div><audio id="player" controls style="width:94%;margin:12px auto;display:block"></audio></div>
<div id="as" style="display:none"><h2 style="color:gold;text-align:center">Sonora</h2><div id="ls"></div></div>
<div id="ab" style="display:none"><div class="card">Banco ok</div></div>
<button id="back" onclick="history.back()">↩️ Voltar</button>
<script>
let musicas=[];let idx=0;
function aba(t,b){document.getElementById('ag').style.display='none';document.getElementById('as').style.display='none';document.getElementById('ab').style.display='none';document.getElementById('a'+t).style.display='block';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('ativo'));b.classList.add('ativo');}
function limparTudo(){if(!confirm('Limpar TODAS com erro?'))return;localStorage.clear();musicas=[];render();alert('Limpou! Add de novo suas 2 músicas .m4a');}
function addMusica(){const inp=document.createElement('input');inp.type='file';inp.accept='audio/*,.m4a,.mp3,.wav,.ogg';inp.multiple=true;inp.onchange=e=>{[...e.target.files].forEach(f=>{if(f.name.includes('function')||f.name.length>80)return;const nome=f.name.replace(/\.(mp3|m4a|wav|ogg|mp4)$/i,'');if(nome.length>60)return;musicas.push({nome:nome,url:URL.createObjectURL(f),toques:0});});render();if(musicas.length)toca(0);};inp.click();}
function toca(i){if(!musicas[i])return;idx=i;const m=musicas[i];const p=document.getElementById('player');p.src=m.url;p.load();p.play().then(()=>{m.toques++;render();}).catch(()=>{});}
function remover(i){if(!confirm('Deletar '+musicas[i].nome+'?'))return;try{URL.revokeObjectURL(musicas[i].url);}catch(e){}musicas.splice(i,1);render();}
function render(){musicas=musicas.filter(m=>{if(!m.nome)return false;if(m.nome.includes('function')||m.nome.includes('document')||m.nome.includes('input.type'))return false;if(m.nome.length>70)return false;return true;});const html=musicas.length?musicas.map((m,i)=>`<div class="musica"><div style="display:flex;justify-content:space-between;align-items:center"><span style="color:gold;font-weight:900">${i+1}. ${m.nome} - ${m.toques}x</span><button onclick="remover(${i})" style="background:#ff2222;color:#fff;border:none;width:40px;height:40px;border-radius:50%">🗑️</button></div><div style="display:flex;gap:8px;margin-top:10px;justify-content:center"><button onclick="toca(${i})" style="background:gold;color:#000;border:none;padding:10px 20px;border-radius:20px;font-weight:900">▶️ Tocar</button><button onclick="toca(${i})" style="background:#333;color:#fff;border:1px solid #555;padding:10px 14px;border-radius:20px">🔁 De novo</button></div></div>`).join(''):'<div style="text-align:center;color:#888;padding:20px">Nenhuma música. Clique + Add</div>';document.getElementById('lg').innerHTML=html;const ls=document.getElementById('ls');if(ls)ls.innerHTML=html;}
(function(){try{let s=localStorage.getItem('musicasQtd');if(s&&s.includes('function'))localStorage.clear();}catch(e){localStorage.clear();}render();})();
</script></body></html>
